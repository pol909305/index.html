<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H Key Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
        }

        /* اللوحة الزرقاء الصغيرة */
        #panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 280px;
            background: linear-gradient(145deg, #0a84ff, #0066cc);
            border-radius: 12px;
            padding: 18px;
            color: white;
            box-shadow: 0 8px 25px rgba(0, 102, 204, 0.5),
                        0 0 15px rgba(10, 132, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: none; /* مخفية في البداية */
            z-index: 9999;
            animation: slideIn 0.25s ease;
        }

        #panel.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-15px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .panel-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .panel-content {
            font-size: 14px;
            line-height: 1.5;
            opacity: 0.95;
        }

        /* رسالة مساعدة في الوسط */
        .hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #555;
            font-size: 18px;
            text-align: center;
        }

        .hint kbd {
            background: #222;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #444;
            color: #0a84ff;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="hint">
        اضغط على زر <kbd>H</kbd> لفتح اللوحة
    </div>

    <div id="panel">
        <div class="panel-header">
            <h3>لوحة التحكم</h3>
            <button class="close-btn" onclick="togglePanel()">×</button>
        </div>
        <div class="panel-content">
            هذي اللوحة الزرقاء الصغيرة تظهر فوق على اليمين لما تضغط H.
            <br><br>
            تقدر تعدل المحتوى من هنا.
        </div>
    </div>

    <script>
        const panel = document.getElementById('panel');
        let isOpen = false;

        function togglePanel() {
            isOpen = !isOpen;
            if (isOpen) {
                panel.classList.add('show');
            } else {
                panel.classList.remove('show');
            }
        }

        // لما تضغط H أو h
        document.addEventListener('keydown', function(e) {
            if (e.key === 'h' || e.key === 'H') {
                // عشان ما يكتب حرف h في أي مكان
                e.preventDefault();
                togglePanel();
            }

            // إغلاق بزر Escape
            if (e.key === 'Escape' && isOpen) {
                togglePanel();
            }
        });
    </script>
</body>
</html>
