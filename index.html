<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM COMPROMISED // BADR</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #00ff41;
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
      height: 100vh;
      cursor: none;
    }

    /* Matrix */
    #matrix {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.6;
    }

    /* Scanlines + Vignette */
    .overlay {
      position: fixed;
      inset: 0;
      background: 
        linear-gradient(rgba(0, 255, 65, 0.03) 50%, transparent 50%),
        radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      background-size: 100% 3px, 100% 100%;
      pointer-events: none;
      z-index: 2;
      animation: scan 6s linear infinite;
    }

    @keyframes scan {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 0 100%, 0 0; }
    }

    /* Main */
    #main {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    /* Title */
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 6vw, 3.8rem);
      font-weight: 900;
      letter-spacing: 6px;
      color: #00ff41;
      text-shadow: 
        0 0 10px #00ff41,
        0 0 20px #00ff41,
        0 0 40px #00ff41,
        0 0 80px #00ff41;
      margin-bottom: 8px;
      position: relative;
      animation: glitch 3s infinite;
    }

    .title::before,
    .title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .title::before {
      left: 3px;
      text-shadow: -2px 0 #ff003c;
      clip-path: inset(20% 0 60% 0);
      animation: glitch-1 2.2s infinite linear alternate-reverse;
    }

    .title::after {
      left: -3px;
      text-shadow: 2px 0 #00f7ff;
      clip-path: inset(50% 0 20% 0);
      animation: glitch-2 2.8s infinite linear alternate-reverse;
    }

    @keyframes glitch {
      0%, 92%, 100% { transform: none; }
      93% { transform: skewX(1.5deg) translateX(2px); }
      95% { transform: skewX(-1.5deg) translateX(-2px); }
      97% { transform: none; }
    }

    @keyframes glitch-1 {
      0% { clip-path: inset(20% 0 60% 0); }
      25% { clip-path: inset(50% 0 20% 0); }
      50% { clip-path: inset(10% 0 70% 0); }
      75% { clip-path: inset(70% 0 10% 0); }
      100% { clip-path: inset(40% 0 40% 0); }
    }

    @keyframes glitch-2 {
      0% { clip-path: inset(60% 0 10% 0); }
      25% { clip-path: inset(15% 0 55% 0); }
      50% { clip-path: inset(75% 0 5% 0); }
      75% { clip-path: inset(5% 0 65% 0); }
      100% { clip-path: inset(30% 0 45% 0); }
    }

    .subtitle {
      font-size: 1rem;
      letter-spacing: 8px;
      color: #00cc33;
      margin-bottom: 30px;
      opacity: 0.9;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; text-shadow: none; }
      50% { opacity: 1; text-shadow: 0 0 15px #00ff41; }
    }

    /* Image */
    .img-box {
      width: min(340px, 82vw);
      border: 2px solid #00ff41;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 30px;
      position: relative;
      box-shadow: 
        0 0 20px #00ff41,
        0 0 40px rgba(0, 255, 65, 0.4),
        inset 0 0 30px rgba(0, 255, 65, 0.1);
      animation: glow 3.5s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px #00ff41, 0 0 40px rgba(0,255,65,0.35); }
      50% { box-shadow: 0 0 35px #00ff41, 0 0 70px rgba(0,255,65,0.6); }
    }

    .img-box img {
      width: 100%;
      display: block;
      filter: grayscale(40%) contrast(1.15) brightness(0.85);
      transition: 0.4s;
    }

    .img-box:hover img {
      filter: grayscale(0%) contrast(1.1) brightness(1);
    }

    /* Info Panel */
    .info-panel {
      background: rgba(0, 15, 0, 0.9);
      border: 1px solid #00ff41;
      border-radius: 10px;
      padding: 24px 28px;
      width: min(440px, 93vw);
      text-align: right;
      box-shadow: 0 0 30px rgba(0, 255, 65, 0.25);
      backdrop-filter: blur(6px);
      position: relative;
      overflow: hidden;
    }

    .info-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00ff41, transparent);
      animation: scanline 2.8s linear infinite;
    }

    @keyframes scanline {
      0% { left: -100%; }
      100% { left: 150%; }
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0, 255, 65, 0.12);
      font-size: 0.95rem;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #00aa2a;
      letter-spacing: 1px;
    }

    .value {
      color: #00ff41;
      font-weight: bold;
      text-shadow: 0 0 10px #00ff41;
      letter-spacing: 1px;
    }

    /* Status */
    .status {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #ff2a2a;
      letter-spacing: 4px;
      animation: blink 1.1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* Footer */
    .footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #007a2a;
      letter-spacing: 3px;
    }

    .footer span {
      color: #00ff41;
      text-shadow: 0 0 8px #00ff41;
    }

    /* Custom Cursor */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid #00ff41;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.15s, height 0.15s, background 0.15s;
      box-shadow: 0 0 12px #00ff41;
      mix-blend-mode: difference;
    }

    .cursor.clicked {
      width: 12px;
      height: 12px;
      background: rgba(0, 255, 65, 0.5);
    }

    @media (max-width: 500px) {
      .title { letter-spacing: 3px; }
      .subtitle { letter-spacing: 4px; font-size: 0.9rem; }
      .info-panel { padding: 18px 20px; }
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>
  <div class="overlay"></div>
  <div class="cursor" id="cursor"></div>

  <div id="main">
    <div class="title" data-text="HACKED BY BADR">HACKED BY BADR</div>
    <div class="subtitle">SYSTEM FULLY COMPROMISED</div>

    <div class="img-box">
      <img src="https://i.pinimg.com/1200x/3c/35/4b/3c354b1a90499fbc5a477a07a21088a1.jpg" alt="target">
    </div>

    <div class="info-panel">
      <div class="info-row">
        <span class="label">IP ADDRESS</span>
        <span class="value" id="ip">LOADING...</span>
      </div>
      <div class="info-row">
        <span class="label">LOCATION</span>
        <span class="value" id="location">LOADING...</span>
      </div>
      <div class="info-row">
        <span class="label">ISP</span>
        <span class="value" id="isp">LOADING...</span>
      </div>
      <div class="info-row">
        <span class="label">OS</span>
        <span class="value" id="os">LOADING...</span>
      </div>
      <div class="info-row">
        <span class="label">SCREEN</span>
        <span class="value" id="screen">LOADING...</span>
      </div>
      <div class="info-row">
        <span class="label">BROWSER</span>
        <span class="value" id="browser">LOADING...</span>
      </div>
    </div>

    <div class="status">● ACCESS GRANTED — DATA EXFILTRATED</div>
    <div class="footer">DEV BY <span>AL-AHMARI</span> • DEV BY <span>AL-AHMARI</span></div>
  </div>

  <audio id="bg-audio" loop>
    <source src="https://bulleti.lol/uploads/04mdkFksditf/TANIN.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Matrix Rain
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const fontSize = 15;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(draw, 35);

    // Cursor
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
    document.addEventListener('mousedown', () => cursor.classList.add('clicked'));
    document.addEventListener('mouseup', () => cursor.classList.remove('clicked'));

    // Audio
    const audio = document.getElementById('bg-audio');
    document.addEventListener('click', () => {
      audio.volume = 0.4;
      audio.play().catch(() => {});
    }, { once: true });

    // System Info
    function getBrowser() {
      const ua = navigator.userAgent;
      if (ua.includes('Edg')) return 'Microsoft Edge';
      if (ua.includes('Chrome')) return 'Google Chrome';
      if (ua.includes('Firefox')) return 'Mozilla Firefox';
      if (ua.includes('Safari')) return 'Apple Safari';
      return 'Unknown';
    }

    function getOS() {
      const p = navigator.platform || '';
      const ua = navigator.userAgent;
      if (/Win/i.test(p)) return 'Windows';
      if (/Mac/i.test(p)) return 'macOS';
      if (/Linux/i.test(p)) return 'Linux';
      if (/Android/i.test(ua)) return 'Android';
      if (/iPhone|iPad/i.test(ua)) return 'iOS';
      return p || 'Unknown';
    }

    async function loadData() {
      document.getElementById('os').textContent = getOS();
      document.getElementById('screen').textContent = `${window.screen.width} × ${window.screen.height}`;
      document.getElementById('browser').textContent = getBrowser();

      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        document.getElementById('ip').textContent = data.ip || 'HIDDEN';
        document.getElementById('location').textContent = `${data.city || '?'}, ${data.country_name || '?'}`;
        document.getElementById('isp').textContent = data.org || 'Private Network';
      } catch {
        document.getElementById('ip').textContent = 'BLOCKED';
        document.getElementById('location').textContent = 'FIREWALL ACTIVE';
        document.getElementById('isp').textContent = 'PROTECTED';
      }
    }

    loadData();
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
